<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Geometry Dash</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: black;}
        canvas { display: block; margin: 0 auto; }
    </style>
  <script>
    var levelId = Number(new URLSearchParams(location.search).get('id'));
    var levelString = new URLSearchParams(location.search).get('string');
    var songID = Number(new URLSearchParams(location.search).get('songID')) || 500476;
    async function start() {
      await navigator.serviceWorker.register('../worker.js');
      await navigator.serviceWorker.ready;

      if (levelString) {
        navigator.serviceWorker.controller?.postMessage({
          levelString: levelString,
          songID: songID
        });
      } else {
        navigator.serviceWorker.controller?.postMessage({ levelId });
      }

      const script = document.createElement('script');
      script.type = 'module';
      script.src = './assets/index-game.js';
      document.body.appendChild(script);
    }
    function updateLevelName() {
      if (levelString) {
        window.levelName = "Local Level";
        return;
      }
      const officialLevels = [
          "Stereo Madness",
          "Back on Track",
          "Polargeist",
          "Dry Out",
          "Base After Base",
          "Cant Let Go",
          "Jumper",
          "Time Machine",
          "Cycles",
          "xStep",
          "Clutterfunk",
          "Theory of Everything",
          "Electroman Adventures",
          "Clubstep",
          "Electrodynamix",
          "Hexagon Force",
          "Blast Processing",
          "Theory of Everything 2",
          "Geometrical Dominator",
          "Deadlocked",
          "Fingerdash",
          "Dash",
          "Every End",
          "Ultiate Destruction"
      ];
      if (levelId < 0) {
        const index = Math.abs(levelId) - 1;
        if (officialLevels[index]) {
            window.levelName = officialLevels[index];
        } else {
            window.levelName = "Unknown";
        }
      }
    }
    start();
    setTimeout(updateLevelName, 1000);
  </script>
  <script>
    let fix = false;
    navigator.serviceWorker.addEventListener("message", (event) => {
      if (event.data.type === "invalid-id") {
        if (fix) return;
        fix = true;
        alert("Level doesn't exist... are you sure you typed the ID correctly?");
        window.location.href = "../";
      }
      if (event.data.type === "rate-limit") {
        if (fix) return;
        fix = true;
        alert("Site is currently being rate limited from GD servers, please try again later! (you may still use one of the default levels below)");
        window.location.href = "../";
      }
      if (event.data.type === 'set-level-name') {
        window.levelName = event.data.name;
      }
    });
  </script>
  <script>
      // Este código tiene que estar en la página del otro dominio
   window.addEventListener('message', (event) => {
    // Verifica que el mensaje venga de un dominio de confianza
    if (event.origin !== 'https://tu-dominio.com') return;

    if (event.data === 'por favor, dame tu captura') {
    // Usamos html2canvas en nuestro propio documento
     html2canvas(document.body).then(canvas => {
      // Convertimos el canvas a una URL de imagen
      const imageUrl = canvas.toDataURL('image/png');

      // Enviamos la imagen de vuelta a la página padre
      window.parent.postMessage({
        type: 'iframe-screenshot',
        imageUrl: imageUrl
          }, 'https://tu-dominio.com'); // El destino debe ser tu dominio
        });
      }
    });
    // ResizeObserver catches iframe size changes that window.resize misses
    // (e.g. parent window maximize, snap, title bar drag)
    new ResizeObserver(() => {
      window.dispatchEvent(new Event('resize'));
    }).observe(document.documentElement);
  </script>
</head>
<body>
</body>
</html>
